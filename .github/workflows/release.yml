name: Build and Release MCL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build single-file exe and create release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\MCL.csproj -p:Platform=x64

      - name: Publish single-file exe
        shell: pwsh
        run: |
          dotnet publish .\MCL.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -o .\release

      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $short = '${{ github.sha }}'.Substring(0, 7)
          $tag = "auto-$short"
          $subject = git log -1 --pretty=%s
          $body = git log -1 --pretty=%b
          $commitUrl = "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          $notes = @"
          ## 更新说明

          - 提交：[$short]($commitUrl)
          - 标题：$subject

          $(if ([string]::IsNullOrWhiteSpace($body)) { "本次提交未填写额外说明。" } else { $body })

          ## 构建信息

          - 平台：Windows x64
          - 类型：.NET 8 自包含单文件
          - 文件：MCL.exe
          - 分支：${{ github.ref_name }}
          - 构建编号：${{ github.run_number }}
          "@
          $notes | Set-Content -Path release-notes.md -Encoding UTF8
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=MCL $short" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            release/MCL.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
